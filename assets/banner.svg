<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
<title id="t">Skin Severity Grader</title>
<desc id="d">One face photo in, six facial skin conditions graded from 0 to 5. Each facial region links to its own severity gauge.</desc>
<style>
.bg{fill:#EEF3F5}
.ink{fill:#14232C}
.mute{fill:#51656F}
.face{fill:none;stroke:#14232C;stroke-opacity:.55;stroke-width:1.5}
.link{fill:none;stroke:#1B6573;stroke-opacity:.35;stroke-width:1}
.dot{fill:#1B6573}
.off{fill:#D3DEE2}
.num{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#51656F;font-variant-numeric:tabular-nums}
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.seg{animation:seg 420ms cubic-bezier(.23,1,.32,1) backwards}
@keyframes seg{from{opacity:0;transform:scaleX(.6)}}
.seg{transform-box:fill-box;transform-origin:left center}
@media (prefers-reduced-motion:reduce){.seg{animation:none}}
</style>
<rect class="bg" width="1280" height="320" rx="20"/>
<text class="t ink" x="64" y="150" font-size="46" font-weight="650" letter-spacing="-0.92">Skin Severity Grader</text>
<text class="t mute" x="64" y="188" font-size="19">One face photo in. Six skin conditions graded 0 to 5.</text>
<text class="t mute" x="64" y="250" font-size="14" letter-spacing="0.14">Screening aid for research, not a diagnosis.</text>
